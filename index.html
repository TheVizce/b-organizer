<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Erkennungsmerkmal für das Userscript – nicht entfernen -->
  <meta name="bp-organizer" content="1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Babe Organizer</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0d0f13">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="icon.svg" alt="" width="22" height="22">
      <span class="brand-name">Babe Organizer</span>
      <span class="count" id="count"></span>
    </div>
    <div class="top-tools" aria-label="Werkzeuge">
      <button class="btn ghost" data-proxy="#btn-rate" title="Einträge der aktuellen Liste nach Kategorien bewerten (R)">⭐ Bewerten</button>
      <button class="btn ghost" data-proxy="calib" title="Kategorie-Abgleich: hält die Bewertung im direkten Vergleich?">⚖️ Abgleich</button>
      <button class="btn ghost" data-proxy="#btn-browse" title="Bilder der aktuellen Liste durchblättern">🖼 Blättern</button>
      <button class="btn ghost" data-proxy="#btn-slide" title="Diashow der aktuellen Liste">▶ Diashow</button>
      <button class="btn ghost" data-proxy="#btn-random" title="Zufälliger Eintrag aus der gefilterten Liste (Z)">🎲 Zufall</button>
      <button class="btn ghost" data-proxy="#btn-to-ranker" title="Alle angezeigten Einträge an den Image Ranker senden">🏆 An Ranker</button>
    </div>
    <div class="top-actions">
      <button class="btn warn" id="btn-pending" hidden style="display:none" title="Änderungen an bekannten Einträgen prüfen">⟳<span class="lbl"> Änderungen</span> (<span class="n">0</span>)</button>
      <button class="btn primary" id="btn-new" title="Neuer Eintrag">＋<span class="lbl"> Neuer Eintrag</span></button>
      <div class="menu-wrap">
        <button class="btn" id="btn-menu" aria-haspopup="true">Daten ▾</button>
        <div class="menu" id="menu" hidden>
          <button data-action="import-file">Importieren (CSV / JSON)…</button>
          <button data-action="export-json">Backup exportieren (JSON)</button>
          <button data-action="export-csv">Als CSV exportieren (Notion)</button>
          <button data-action="scan-images">Alle Bilder neu prüfen</button>
          <button data-action="find-dups">Doppel-Einträge suchen</button>
          <button data-action="upd-cfg">Update-Rhythmus…</button>
          <button data-action="vote-sync">Babepedia-Noten angleichen…</button>
          <button data-action="calib" class="menu-mobile-only">⚖️ Kategorie-Abgleich…</button>
          <hr>
          <button data-action="help">Anleitung</button>
          <button data-action="shortcuts">Tastenkürzel &amp; Gesten</button>
          <button data-action="clear-scores" class="danger">Kategorien-Bewertungen zurücksetzen…</button>
          <button data-action="clear-all" class="danger">Alle Einträge löschen…</button>
        </div>
      </div>
      <input type="file" id="file-input" accept=".csv,.json,text/csv,application/json" hidden>
    </div>
  </header>

  <section class="toolbar">
    <input type="search" id="q" placeholder="Suchen: Name, AKA, Tags, Notizen…" autocomplete="off">
    <select id="f-nationality"><option value="">Nationalität: alle</option></select>
    <select id="f-cat"><option value="">Bereich: alle</option></select>
    <select id="f-hair"><option value="">Haarfarbe: alle</option></select>
    <select id="f-eyes"><option value="">Augenfarbe: alle</option></select>
    <select id="f-body"><option value="">Figur: alle</option></select>
    <select id="f-active">
      <option value="">Aktiv: egal</option>
      <option value="true">nur aktiv</option>
      <option value="false">nur inaktiv</option>
    </select>
    <select id="f-rating">
      <option value="">Noten: alle</option>
      <option value="diff" title="Gelöschte Babepedia-Profile zählen bei den Vergleichen nicht mit">Tool-Note ≠ meine Babepedia-Note</option>
      <option value="same">Tool-Note = meine Babepedia-Note</option>
      <option value="missing">nur eine der beiden Noten vorhanden</option>
      <option value="site-only">nur Babepedia-Note (noch keine Tool-Note)</option>
      <option value="mine-only">nur Tool-Note (auf Babepedia noch offen)</option>
      <option value="none">weder Tool- noch Babepedia-Note</option>
      <option value="scored">♥ Tool-Note vorhanden</option>
      <option value="unscored">noch keine Tool-Note</option>
    </select>
    <select id="f-ranker">
      <option value="">Ranker: egal</option>
      <option value="true">🏆 im Ranker</option>
      <option value="false">nicht im Ranker</option>
      <option value="stale">⟳ im Ranker veraltet</option>
    </select>
    <select id="f-status" title="Gibt es das Profil auf Babepedia noch?">
      <option value="">Profil-Status: alle</option>
      <option value="ok">Profil vorhanden</option>
      <option value="gone-any">⚠︎ auf Babepedia gelöscht</option>
      <option value="gone">⚠︎ gelöscht – kein Archiv</option>
      <option value="gone-archive">🏛️ gelöscht – Archiv vorhanden</option>
      <option value="none">kein Babepedia-Profil (von Hand angelegt)</option>
    </select>
    <select id="f-missing" title="Einträge, bei denen diese Werte fehlen (auch im Image Ranker genutzt)">
      <option value="">Fehlende Werte: egal</option>
      <option value="any">⚠ irgendeiner fehlt</option>
      <option value="none">✓ alle vorhanden</option>
      <optgroup label="fehlt (evtl. auch andere)">
        <option value="Professions">fehlt: Profession</option>
        <option value="Nationality">fehlt: Nationality</option>
        <option value="Hair color">fehlt: Hair Color</option>
        <option value="Ethnicity">fehlt: Ethnicity</option>
        <option value="Born">fehlt: Born</option>
        <option value="Bra/Cup">fehlt: Bra/Cup</option>
        <option value="__img">fehlt: Bild (lädt nicht)</option>
      </optgroup>
      <optgroup label="nur dieser fehlt">
        <option value="only:Professions">nur Profession fehlt</option>
        <option value="only:Nationality">nur Nationality fehlt</option>
        <option value="only:Hair color">nur Hair Color fehlt</option>
        <option value="only:Ethnicity">nur Ethnicity fehlt</option>
        <option value="only:Born">nur Born fehlt</option>
        <option value="only:Bra/Cup">nur Bra/Cup fehlt</option>
        <option value="only:__img">nur Bild (lädt nicht) fehlt</option>
      </optgroup>
    </select>
    <label class="chk"><input type="checkbox" id="f-fav"> nur Favoriten</label>
    <select id="sort">
      <option value="name">Sortierung: Name A–Z</option>
      <option value="created">Zuletzt hinzugefügt</option>
      <option value="updated">Zuletzt geändert</option>
      <option value="global">Babepedia Ø ↓</option>
      <option value="score">♥ Tool-Note ↓</option>
      <option value="site">Meine Babepedia-Note ↓</option>
      <option value="diff">Tool- vs. Babepedia-Note: größte Abweichung</option>
      <option value="rank">Rank ↑</option>
      <option value="scraped">🔁 Zuletzt von Babepedia geholt ↑ (älteste zuerst)</option>
      <option value="random">🎲 Zufällige Reihenfolge</option>
      <option value="ranker">🏆 Ranker-Score ↓</option>
    </select>
    <span id="xf" class="xf"></span>
    <span id="sf" class="xf"></span>
    <div class="seg" role="group" aria-label="Ansicht">
      <button data-view="grid" class="on" title="Karten">▦</button>
      <button data-view="table" title="Tabelle">☰</button>
      <button data-view="stats" title="Statistik">📊</button>
    </div>
    <button class="btn" id="btn-to-ranker" title="Alle angezeigten Einträge an den Image Ranker senden">🏆 An Ranker</button>
    <button class="btn ghost" id="btn-rate" title="Einträge der aktuellen Liste nach Kategorien bewerten (R)">⭐ Bewerten</button>
    <button class="btn ghost" id="btn-random" title="Zufälliger Eintrag aus der gefilterten Liste (Z)">🎲 Zufall</button>
    <button class="btn ghost" id="btn-browse" title="Bilder der aktuellen Liste durchblättern">🖼 Blättern</button>
    <button class="btn ghost" id="btn-slide" title="Diashow der aktuellen Liste">▶ Diashow</button>
    <button class="btn ghost" id="btn-view-cfg" title="Kacheln und Filter anpassen">⚙︎ Ansicht</button>
    <button class="btn ghost" id="btn-reset" title="Filter zurücksetzen">✕ Filter</button>
  </section>

  <div id="upd-banner" class="upd-banner" hidden></div>
  <main id="main"></main>

  <!-- Detail / Formular -->
  <div class="overlay" id="overlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <!-- GitHub-Sync (gemeinsam für alle Tools, Einstellungen auf der Startseite) -->
  <script src="/startseite/sync-v1.js"></script>
  <script src="app.js"></script>
</body>
</html>
